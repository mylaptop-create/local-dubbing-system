[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "local-dubbing-system"
version = "0.1.0"
description = "Local Chinese Video to English Dubbing Application"
authors = [{ name = "Jules" }]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.20.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-multipart>=0.0.6",
    "imageio-ffmpeg>=0.4.8",
    "pyyaml>=6.0",
    "psutil>=5.9.0",
    "requests>=2.28.0",
    "edge-tts>=6.1.9",
    "numpy>=1.22.0",
    "scipy>=1.8.0",
    "yt-dlp>=2024.1.0",
]

[project.scripts]
app = "backend.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
